name: Android Common 10 Libraries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-common10.yml"
      - "libraries/android-smoke.json"
      - "scripts/android-smoke.py"
      - "scripts/linux/**"
      - "scripts/lib/**"
      - "scripts/setup.sh"
      - "scripts/build.sh"
      - "scripts/android/**"
      - "libraries/manifest.json"
      - "tests/test_android_smoke.py"

permissions:
  contents: read

concurrency:
  group: android-common10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate per-library report aggregation
        run: python3 -m unittest discover -s tests -p test_android_smoke.py -v
      - id: matrix
        run: echo "value=$(python3 scripts/android-smoke.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ${{ matrix.library }} with ${{ matrix.backend }}
        env:
          BACKEND: ${{ matrix.backend }}
          LIBRARY: ${{ matrix.library }}
        run: bash "scripts/linux/${LIBRARY}.sh" --backend "$BACKEND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common10-${{ matrix.library }}-${{ matrix.backend }}
          path: dist/smoke/
          if-no-files-found: error
          retention-days: 14

  report:
    if: always() && needs.discover.result == 'success'
    needs: [discover, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: common10-*
          path: dist/smoke
          merge-multiple: true
      - name: Generate build report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/android-smoke.py report --run-url "$RUN_URL"
      - name: Publish Markdown even when a build fails
        if: always()
        env:
          REPORT_BRANCH: ${{ github.ref_name }}
        run: |
          test -f docs/android-support/common10-build.md
          cat docs/android-support/common10-build.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/android-support/common10-build.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: record common Android library build results"
            git pull --rebase origin "$REPORT_BRANCH"
            git push origin "HEAD:$REPORT_BRANCH"
          fi
