name: Android Cross-Platform Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-cross-platform.yml"
      - "libraries/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/android-cross-platform.yml"
      - "libraries/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, linux, mac, win]
      backend:
        type: choice
        default: all
        options: [all, vcpkg, conan, xmake]

permissions:
  contents: read

concurrency:
  group: android-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          SELECTED_PLATFORM: ${{ inputs.platform || 'all' }}
          SELECTED_BACKEND: ${{ inputs.backend || 'all' }}
        run: |
          if [ "$SELECTED_PLATFORM" = all ]; then
            platform_args=(--all-platforms)
          else
            platform_args=(--platform "$SELECTED_PLATFORM")
          fi
          echo "value=$(python3 scripts/android-smoke.py matrix "${platform_args[@]}" --group-by-backend --backend "$SELECTED_BACKEND")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }} / ${{ matrix.backend }} -> Android
    needs: discover
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      PLATFORM: ${{ matrix.platform }}
      BACKEND: ${{ matrix.backend }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build per-library shell entries
        if: matrix.platform != 'win'
        shell: bash
        run: |
          python scripts/android-smoke.py libraries > "$RUNNER_TEMP/android-libraries.txt"
          status=0
          while IFS= read -r library; do
            bash "scripts/${PLATFORM}/${library}.sh" --backend "$BACKEND" || status=1
          done < "$RUNNER_TEMP/android-libraries.txt"
          exit "$status"
      - name: Build per-library native Windows batch entries
        if: matrix.platform == 'win'
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          python scripts\android-smoke.py libraries > "%RUNNER_TEMP%\android-libraries.txt"
          if errorlevel 1 exit /b 1
          set "build_status=0"
          for /f "usebackq delims=" %%L in ("%RUNNER_TEMP%\android-libraries.txt") do (
            call "scripts\win\%%L.bat" --backend "%BACKEND%"
            if errorlevel 1 set "build_status=1"
          )
          exit /b !build_status!
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-cross-${{ matrix.platform }}-${{ matrix.backend }}
          path: dist/smoke/
          if-no-files-found: error
          retention-days: 14
